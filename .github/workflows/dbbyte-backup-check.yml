name: DBByte backup helper checks

on:
  push:
    branches: [hermes-agent-migration]
    paths:
      - "scripts/dbbyte_backup.py"
      - "tests/test_dbbyte_backup_crypto.py"
      - "tests/test_dbbyte_backup_s3.py"
      - "scripts/merge_hermes_config.py"
      - "tests/test_merge_hermes_config.py"
      - ".github/workflows/dbbyte-backup-check.yml"
  pull_request:
    paths:
      - "scripts/dbbyte_backup.py"
      - "tests/test_dbbyte_backup_crypto.py"
      - ".github/workflows/dbbyte-backup-check.yml"

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install boto3 cryptography 'moto[s3]'
      - name: Compile helper
        run: python -m py_compile scripts/dbbyte_backup.py scripts/merge_hermes_config.py
      - name: Test authenticated encryption
        run: python -m unittest tests/test_dbbyte_backup_crypto.py tests/test_dbbyte_backup_s3.py tests/test_merge_hermes_config.py -v
