name: Hermes Docker image build check

on:
  push:
    branches: [hermes-agent-migration]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/docker-build-check.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker/**"
      - "scripts/**"
      - ".github/workflows/docker-build-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build custom Hermes image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hermes-agent:ci-check
      - name: Smoke-test Hermes CLI and backup dependencies
        run: |
          docker run --rm --entrypoint /bin/sh hermes-agent:ci-check -ec '
            python3 -c "import boto3, cryptography"
            /usr/bin/python3 -c "import yaml"
            /usr/bin/python3 -m py_compile /opt/hermes/scripts/merge_hermes_config.py
            sh -n /opt/hermes/docker/main-wrapper.sh
            sh -n /opt/hermes/bin/hermes
            sh -n /etc/s6-overlay/s6-rc.d/dashboard/run
            grep -q "HERMES_HOME" /etc/profile.d/hermes.sh
            test -f /opt/hermes/profile-seed/skills/tiktok-research/SKILL.md
            command -v hermes
            hermes backup --help >/dev/null
            hermes import --help >/dev/null
            tmpdir="$(mktemp -d)"
            mkdir -p "$tmpdir/source" "$tmpdir/restore"
            printf "hermes-backup-fixture" > "$tmpdir/source/SOUL.md"
            printf "model: {}\\n" > "$tmpdir/source/config.yaml"
            printf "model: {}\\n" > "$tmpdir/restore/config.yaml"
            chown -R hermes:hermes "$tmpdir"
            chmod 0755 "$tmpdir" "$tmpdir/source" "$tmpdir/restore"
            HERMES_HOME="$tmpdir/source" HOME="$tmpdir/source" hermes backup -o "$tmpdir/hermes-test.zip"
            test -s "$tmpdir/hermes-test.zip"
            HERMES_HOME="$tmpdir/restore" HOME="$tmpdir/restore" hermes import "$tmpdir/hermes-test.zip" --force
            cmp "$tmpdir/source/SOUL.md" "$tmpdir/restore/SOUL.md"
            rm -rf "$tmpdir"
            test -x /etc/cont-init.d/01a-dbbyte-restore
            test -x /etc/cont-init.d/01b-install-profile
            test -f /opt/hermes/profile-seed/AGENTS.md
            test -f /opt/hermes/profile-seed/skills/tiktok-research/SKILL.md
            test -f /opt/hermes/docker/SOUL.md
            sh -n /etc/cont-init.d/01b-install-profile
            /etc/cont-init.d/01b-install-profile
            test -f /app/.cache/hermes-home/AGENTS.md
            test -f /app/.cache/hermes-home/skills/tiktok-research/SKILL.md
            grep -q "memory_enabled: true" /app/.cache/hermes-home/config.yaml
            grep -q "guest: true" /app/.cache/hermes-home/config.yaml
            test -x /etc/s6-overlay/s6-rc.d/hermes-backup/run
            test -f /etc/s6-overlay/s6-rc.d/user/contents.d/hermes-backup
          '
